<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}SpendWise{% endblock %}</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon"
          href="{{ url_for('static', filename='images/favicon.ico') }}"
          type="image/x-icon">

    <!-- Main Styles -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='styles.css') }}">

    {% block extra_css %}{% endblock %}
</head>

<body>

    <header>
        <div class="logo-container">
            <img src="{{ url_for('static', filename='images/logo.png') }}"
                 alt="SpendWise Logo"
                 class="logo">
            <div class="brand">
                <h1>SpendWise</h1>
                <p>Track Smarter. Spend Better.</p>
            </div>
        </div>

        <nav>
            <a href="{{ url_for('home') }}">Dashboard</a>
            <a href="{{ url_for('add_page') }}">Add Expense</a>
            <a href="{{ url_for('monthly_page') }}">Analytics</a>
            <a href="{{ url_for('recent_page') }}">Transactions</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 SpendWise · Personal Expense Manager</p>
    </footer>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>

    <!-- Main JavaScript -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>

    {% block extra_js %}{% endblock %}

</body>
</html>
